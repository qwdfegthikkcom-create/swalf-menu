<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e2c35">
<title>دجلة · الكاشير (نموذج عرض)</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/dijla.css">
<style>
body{background:#efe7d8}
/* الدخول */
.login{min-height:100vh;display:grid;place-items:center;padding:1.5rem 1rem;background:var(--river)}
.login-card{width:100%;max-width:22rem;background:var(--paper);border-radius:20px;padding:2rem 1.5rem;text-align:center;display:grid;gap:1rem;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.login-card .logo b{color:var(--river)}
.login-card h1{font-size:1.2rem}
.pin{width:100%;text-align:center;font-size:1.6rem;letter-spacing:.5em;padding:.6rem;border-radius:12px;border:1.5px solid var(--line);background:#fff;direction:ltr}
.pin:focus{outline:none;border-color:var(--brass)}
.err{color:var(--bad);font-weight:600;font-size:.9rem;min-height:1.4em}
.hint{color:var(--muted);font-size:.8rem}

/* الشريط العلوي */
.top{position:sticky;top:0;z-index:30;background:var(--river);color:var(--paper)}
.top-in{display:flex;flex-wrap:wrap;align-items:center;gap:.6rem 1rem;padding:.6rem 1rem;max-width:90rem;margin:auto}
.brand{display:flex;align-items:center;gap:.6rem;margin-inline-end:auto}
.brand b{font:600 1.6rem/1 var(--head);color:#fff}
.brand span{color:var(--foam);font-size:.9rem}
.conn{display:inline-flex;align-items:center;gap:.4rem;font-size:.8rem;color:var(--foam)}
.conn::before{content:"";width:.6rem;height:.6rem;border-radius:50%;background:#4cc38a;box-shadow:0 0 0 3px rgba(76,195,138,.25)}
.conn.off::before{background:#e5654f;box-shadow:0 0 0 3px rgba(229,101,79,.3)}
.top .btn-ghost{color:#fff;border-color:rgba(255,255,255,.25)}
.top .btn-ghost[aria-pressed="false"]{opacity:.7}
.tabs{display:flex;gap:.25rem;overflow-x:auto;padding:0 1rem;max-width:90rem;margin:auto;scrollbar-width:none}
.tabs button{flex:none;background:none;border:0;color:var(--foam);padding:.7rem 1rem;font-weight:600;border-bottom:3px solid transparent;display:inline-flex;gap:.4rem;align-items:center}
.tabs button[aria-selected="true"]{color:#fff;border-color:var(--brass)}
.badge{display:inline-grid;place-items:center;min-width:1.4rem;height:1.4rem;padding:0 .35rem;border-radius:999px;background:var(--brass);color:#fff;font-size:.75rem}
.wrap{max-width:90rem;margin:auto;padding:1rem}
.mode-note{font-size:.82rem;color:var(--muted);margin-bottom:.8rem}

/* النداءات */
.alerts{display:grid;gap:.5rem;margin-bottom:1rem}
.alert{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem 1rem;background:var(--warn-l);border:1.5px solid #ecc3a3;border-radius:12px;padding:.6rem .9rem;font-weight:600}
.alert span{margin-inline-end:auto}
.alert time{font-weight:400;color:var(--muted);font-size:.85rem}

/* لوحة الطلبات */
.board{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(16.5rem,1fr));align-items:start}
.col{background:rgba(255,255,255,.45);border-radius:16px;padding:.75rem;min-height:8rem}
.col h2{font:600 1rem/1.4 var(--body);display:flex;align-items:center;gap:.5rem;margin:0 .25rem .7rem}
.col h2::before{content:"";width:.7rem;height:.7rem;border-radius:50%;background:var(--c,var(--muted))}
.col-new{--c:var(--brass)}.col-preparing{--c:var(--warn)}.col-ready{--c:var(--ok)}.col-served{--c:var(--river-3)}
.col-empty{color:var(--muted);font-size:.85rem;text-align:center;padding:1rem 0}
.tickets{display:grid;gap:.7rem}
.board{grid-template-columns:repeat(auto-fit,minmax(17.5rem,1fr))}
.ticket{background:var(--paper);border-radius:12px;border:1px solid var(--line);border-top:4px solid var(--c,var(--line));padding:.75rem .85rem;box-shadow:var(--shadow)}
.ticket.fresh{animation:fresh 1s ease 3}
@keyframes fresh{50%{box-shadow:0 0 0 5px var(--brass-l)}}
.t-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:.25rem .6rem}
.t-head b{font:600 1.2rem/1.2 var(--body)}
.t-head .where{font-weight:600;color:var(--river-2)}
.t-head time{margin-inline-start:auto;color:var(--muted);font-size:.8rem}
.t-lines{list-style:none;padding:0;margin:.5rem 0;display:grid;gap:.2rem;font-size:.92rem}
.t-lines b{display:inline-block;min-width:1.8rem;color:var(--brass-d)}
.t-lines em{display:block;font-style:normal;color:var(--bad);font-size:.82rem;padding-inline-start:1.8rem}
.t-note{background:var(--bad-l);color:var(--bad);border-radius:8px;padding:.3rem .6rem;font-size:.85rem;margin-bottom:.5rem}
.t-foot{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem;border-top:1px dashed var(--line);padding-top:.55rem}
.t-foot .price{margin-inline-end:auto}
.icon-btn{width:2.25rem;height:2.25rem;border-radius:999px;border:1.5px solid var(--line);background:none;display:grid;place-items:center}
.icon-btn svg{width:1.05rem;height:1.05rem}

/* طلب جديد */
.pos{display:grid;gap:1rem}
@media (min-width:64rem){.pos{grid-template-columns:1fr 24rem;align-items:start}.pos-ticket{position:sticky;top:7.5rem}}
.pos-tools{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:.8rem}
.pos-tools input{flex:1;min-width:10rem;padding:.55rem .9rem;border-radius:999px;border:1.5px solid var(--line);background:#fff}
.pos-cats{display:flex;gap:.35rem;flex-wrap:wrap}
.pos-cats button{padding:.35rem .8rem;border-radius:999px;border:1.5px solid var(--line);background:var(--paper);font-weight:600;font-size:.85rem}
.pos-cats button[aria-pressed="true"]{background:var(--river);color:#fff;border-color:var(--river)}
.pos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(9.5rem,1fr));gap:.6rem}
.pos-grid button{text-align:start;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:.7rem;min-height:5rem;display:grid;align-content:space-between;gap:.3rem}
.pos-grid button:hover{border-color:var(--brass)}
.pos-grid button:disabled{opacity:.45}
.pos-grid .n{font-weight:600;line-height:1.35}
.pos-grid .p{color:var(--brass-d);font-size:.88rem}
.pos-ticket,.panel-card{background:var(--paper);border-radius:16px;border:1px solid var(--line);padding:1rem;box-shadow:var(--shadow)}
.pos-ticket h2,.panel-card h2{font-size:1.1rem;margin-bottom:.6rem}
.pos-line{display:grid;grid-template-columns:1fr auto;gap:.2rem .6rem;align-items:center;padding:.5rem 0;border-bottom:1px solid var(--line)}
.pos-line small{color:var(--muted)}
.field{display:grid;gap:.3rem;margin-top:.8rem}
.field label{font-weight:600;font-size:.88rem}
.field select,.field input{padding:.5rem .8rem;border-radius:10px;border:1.5px solid var(--line);background:#fff}
.total{display:flex;justify-content:space-between;font-weight:600;font-size:1.1rem;margin:.9rem 0 .7rem}

/* الأصناف */
.avail{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(18rem,1fr));align-items:start}
.av-row{display:flex;align-items:center;justify-content:space-between;gap:.75rem;padding:.55rem 0;border-bottom:1px solid var(--line)}
.av-row:last-child{border-bottom:0}
.switch{position:relative;width:3.1rem;height:1.75rem;border-radius:999px;border:0;background:var(--line);flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:.2rem;inset-inline-start:.2rem;width:1.35rem;height:1.35rem;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:inset-inline-start .2s}
.switch[aria-checked="true"]{background:var(--ok)}
.switch[aria-checked="true"]::after{inset-inline-start:1.55rem}
.av-state{font-size:.8rem;color:var(--muted);min-width:3.5rem;text-align:center}

/* الملخص */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(10rem,1fr));gap:.75rem;margin-bottom:1rem}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:.9rem}
.stat span{display:block;color:var(--muted);font-size:.82rem}
.stat b{display:block;font:600 1.35rem/1.3 var(--body);color:var(--river);margin-top:.2rem}
.sum-grid{display:grid;gap:1rem}
@media (min-width:64rem){.sum-grid{grid-template-columns:1fr 1.5fr}}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{text-align:start;padding:.5rem .4rem;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600;font-size:.8rem}
.table-scroll{overflow-x:auto}

/* الإيصال: لا يظهر إلا عند الطباعة */
#receipt{display:none}
@media print{
  @page{size:80mm auto;margin:4mm}
  body{background:#fff}
  body>*:not(#receipt){display:none!important}
  #receipt{display:block;width:72mm;margin:auto;color:#000;font:12px/1.5 var(--body)}
  #receipt h1{text-align:center;font:600 22px/1.2 var(--head)}
  #receipt .c{text-align:center}
  #receipt table{font-size:12px}
  #receipt th,#receipt td{border-bottom:1px dashed #999;padding:3px 0}
  #receipt .tot{font-weight:600;font-size:14px}
}
</style>
</head>
<body>

<section class="login" id="login" hidden aria-labelledby="login-h">
  <form class="login-card" id="login-form">
    <span class="logo"><b>دجلة</b></span>
    <h1 id="login-h">شاشة الكاشير</h1>
    <label class="sr" for="pin">رمز الدخول</label>
    <input class="pin" id="pin" type="password" inputmode="numeric" autocomplete="current-password" pattern="[0-9]*" maxlength="8" placeholder="••••" required>
    <p class="err" id="login-err" role="alert"></p>
    <button class="btn btn-primary btn-block" type="submit">دخول</button>
    <p class="hint" id="login-hint"></p>
    <p class="hint"><a href="./">رجوع إلى المنيو</a></p>
  </form>
</section>

<div id="app" hidden>
  <header class="top">
    <div class="top-in">
      <div class="brand"><b>دجلة</b><span>الكاشير · نموذج عرض</span></div>
      <span class="conn" id="conn" role="status">متصل</span>
      <button class="btn btn-ghost btn-sm" id="sound" type="button" aria-pressed="true">التنبيه الصوتي</button>
      <button class="btn btn-ghost btn-sm" id="logout" type="button">خروج</button>
    </div>
    <div class="tabs" role="tablist" aria-label="أقسام الكاشير">
      <button role="tab" id="tab-orders" aria-controls="p-orders" aria-selected="true">الطلبات <span class="badge" id="active-count">٠</span></button>
      <button role="tab" id="tab-pos" aria-controls="p-pos" aria-selected="false" tabindex="-1">طلب جديد</button>
      <button role="tab" id="tab-items" aria-controls="p-items" aria-selected="false" tabindex="-1">الأصناف</button>
      <button role="tab" id="tab-summary" aria-controls="p-summary" aria-selected="false" tabindex="-1">ملخص اليوم</button>
    </div>
  </header>

  <div class="wrap">
    <p class="mode-note" id="mode-note"></p>
    <div class="alerts" id="alerts" aria-live="polite"></div>

    <section id="p-orders" role="tabpanel" aria-labelledby="tab-orders">
      <div class="board" id="board"></div>
    </section>

    <section id="p-pos" role="tabpanel" aria-labelledby="tab-pos" hidden>
      <div class="pos">
        <div>
          <div class="pos-tools">
            <label class="sr" for="pos-q">ابحث عن صنف</label>
            <input id="pos-q" type="search" placeholder="ابحث عن صنف">
            <div class="pos-cats" id="pos-cats" role="group" aria-label="القسم"></div>
          </div>
          <div class="pos-grid" id="pos-grid"></div>
        </div>
        <aside class="pos-ticket" aria-labelledby="pos-h">
          <h2 id="pos-h">الطلب الجديد</h2>
          <div id="pos-lines"><p class="col-empty">اضغط على الأصناف لإضافتها.</p></div>
          <div class="field">
            <label for="pos-place">المكان</label>
            <select id="pos-place"></select>
          </div>
          <div class="field">
            <label for="pos-note">ملاحظة (اختياري)</label>
            <input id="pos-note" maxlength="200">
          </div>
          <div class="total"><span>المجموع</span><span class="price" id="pos-total">٠</span></div>
          <button class="btn btn-brass btn-block" id="pos-send" type="button" disabled>أرسل إلى المطبخ</button>
          <button class="btn btn-ghost btn-block" id="pos-clear" type="button" style="margin-top:.5rem" disabled>مسح</button>
        </aside>
      </div>
    </section>

    <section id="p-items" role="tabpanel" aria-labelledby="tab-items" hidden>
      <p class="mode-note">الصنف الذي «نفد» يظهر للزبائن باهتاً ولا يمكن طلبه، حتى ترجعه «متوفراً».</p>
      <div class="avail" id="avail"></div>
    </section>

    <section id="p-summary" role="tabpanel" aria-labelledby="tab-summary" hidden>
      <p class="mode-note">طلبات اليوم بتوقيت بغداد. الأرقام من طلبات النموذج التجريبية.</p>
      <div class="stats" id="stats"></div>
      <div class="sum-grid">
        <div class="panel-card"><h2>الأكثر طلباً</h2><div class="table-scroll" id="top-items"></div></div>
        <div class="panel-card"><h2>الطلبات المدفوعة</h2><div class="table-scroll" id="paid-list"></div></div>
      </div>
    </section>
  </div>
</div>

<div id="receipt" aria-hidden="true"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="assets/menu.js"></script>
<script src="assets/backend.js"></script>
<script src="assets/cashier.js"></script>
</body>
</html>
